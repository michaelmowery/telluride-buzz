<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Buzz admin</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <header class="top">
    <a class="top-brand" href="/admin">Buzz admin</a>
    <nav class="top-nav" id="nav" hidden>
      <a href="#health" data-nav="health">Health board</a>
      <a href="#towns" data-nav="towns">Towns</a>
      <button type="button" class="link" id="logout">Sign out</button>
    </nav>
  </header>

  <main id="app">
    <section id="login" class="card narrow" hidden>
      <h1>Sign in</h1>
      <form id="login-form">
        <label>Admin password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
        <button type="submit">Sign in</button>
        <p class="error" id="login-error" role="alert"></p>
      </form>
    </section>
    <section id="view"></section>
  </main>

  <script src="/admin.js" type="module"></script>
</body>
</html>
